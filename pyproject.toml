[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drekai"
version = "1.2.0"
description = "A modern, async-first Python wrapper for OpenAI-compatible LLM APIs with built-in tool use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "drek", email = "drek.dev124@gmail.com" },
]
keywords = ["openai", "llm", "chat", "tools", "async", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/drek124/drekai"
Repository = "https://github.com/drek124/drekai"
Issues = "https://github.com/drek124/drekai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["drekai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
